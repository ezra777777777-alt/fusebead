name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default tests use temp SQLite files and never SMTP. PostgreSQL uses an isolated CI service.
env:
  DATABASE_URL: ""
  PG_TEST_DATABASE_URL: ""
  MAIL_DELIVERY: local
  SMTP_HOST: smtp.invalid
  SMTP_USER: ""
  SMTP_PASS: ""
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test test/*.test.cjs
      - run: npm run build

  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Create isolated PostgreSQL test databases
        run: |
          node -e "const {Client}=require('pg');(async()=>{const c=new Client('postgresql://ci:ci-test-only@localhost:5432/postgres');await c.connect();await c.query('CREATE DATABASE fusebead_releasecheck_lifecycle');await c.query('CREATE DATABASE fusebead_releasecheck_registry');await c.end()})().catch(e=>{console.error(e);process.exit(1)})"
      - name: PostgreSQL lifecycle
        run: node --test test/postgres.test.cjs
        env:
          PG_TEST_DATABASE_URL: postgresql://ci:ci-test-only@localhost:5432/fusebead_releasecheck_lifecycle
      - name: PostgreSQL registry concurrency
        run: node --test test/postgres-dedup.test.cjs
        env:
          PG_TEST_DATABASE_URL: postgresql://ci:ci-test-only@localhost:5432/fusebead_releasecheck_registry
      - name: Committed server/dist matches source
        run: git diff --exit-code -- dist

  processor:
    name: Python image tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_cover
