name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tests use temp SQLite files (DB_PATH in each test), never DATABASE_URL, and never SMTP.
env:
  DATABASE_URL: ""
  PG_TEST_DATABASE_URL: ""
  MAIL_DELIVERY: local
  SMTP_HOST: smtp.invalid
  SMTP_USER: ""
  SMTP_PASS: ""
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test test/*.test.cjs
      - run: npm run build

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Committed server/dist matches source
        run: git diff --exit-code -- dist

  processor:
    name: Python image tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_cover
