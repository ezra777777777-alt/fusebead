<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fuse bead: colored ring + dark center hole + highlight -->
    <g id="bead-coral">
      <circle r="18" fill="#ff6b6b"/>
      <circle r="18" fill="none" stroke="#e55a5a" stroke-width="2"/>
      <circle r="6" fill="#1e1e2e" opacity="0.6"/>
      <ellipse cx="-4" cy="-5" rx="5" ry="3" fill="white" opacity="0.2"/>
    </g>
    <g id="bead-amber">
