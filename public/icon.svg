      <circle r="18" fill="none" stroke="#e8953a" stroke-width="2"/>
      <circle r="6" fill="#1e1e2e" opacity="0.6"/>
      <ellipse cx="-4" cy="-5" rx="5" ry="3" fill="white" opacity="0.2"/>
