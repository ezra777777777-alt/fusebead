  <!-- Bead pattern — symmetrical mandala (center 256,256) -->

  <!-- Center bead -->
  <use href="#bead-coral" x="256" y="256"/>

  <!-- Inner ring (4 beads — diamond) -->
  <use href="#bead-amber" x="256" y="208"/>
  <use href="#bead-yellow" x="304" y="256"/>
  <use href="#bead-mint" x="256" y="304"/>
  <use href="#bead-blue" x="208" y="256"/>

  <!-- Inner ring diagonals (4 beads) -->
  <use href="#bead-pink" x="290" y="222"/>
  <use href="#bead-lavender" x="290" y="290"/>
  <use href="#bead-pink" x="222" y="290"/>
  <use href="#bead-lavender" x="222" y="222"/>

  <!-- Middle ring cardinals (8 beads — 2 per direction) -->
